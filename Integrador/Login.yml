info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/auth/login
  body:
    type: json
    data: |-
      {
        "nombre": "usuario",
        "clave": "clave"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
